<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sir. Cond. COLY - Módulo Visual Estável</title>
    <style>
        body {
            background-color: #010610;
            background-image: 
                linear-gradient(rgba(0, 210, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 210, 255, 0.02) 1px, transparent 1px);
            background-size: 25px 25px;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .container {
            text-align: center;
            width: 100%;
            max-width: 450px;
            padding: 20px;
        }

        h1 {
            color: #00d2ff;
            font-size: 28px;
            margin: 0;
            letter-spacing: 3px;
            text-shadow: 0 0 10px #00d2ff;
        }
        .subtitle {
            color: #51759e;
            font-size: 11px;
            margin: 5px 0 25px 0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .stage {
            position: relative;
            height: 420px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
        }

        /* O Homem - Respiração Contínua de Fundo */
        .hologram-character {
            width: 250px;
            height: 320px;
            position: absolute;
            bottom: 70px;
            z-index: 3;
            opacity: 0.88;
            filter: drop-shadow(0 0 10px rgba(0, 210, 255, 0.6)) contrast(1.1) brightness(1.1);
            animation: respirarNatural 3.5s ease-in-out infinite alternate, flickerLight 0.15s infinite;
            pointer-events: none;
            transform-origin: bottom center;
        }

        .hologram-character img {
            width: 100%;
            height: auto;
            position: absolute;
            bottom: 0;
            left: 0;
        }

        /* Camadas Artificiais de Expressão (Boca e Mãos Néon) */
        .digital-lips {
            position: absolute;
            top: 27%;
            left: 47%;
            width: 16px;
            height: 4px;
            background-color: #00d2ff;
            box-shadow: 0 0 8px #00ffff;
            border-radius: 50%;
            z-index: 5;
            opacity: 0;
            transform-origin: center;
        }

        .digital-hand-glow {
            position: absolute;
            bottom: 30%;
            left: 30%;
            width: 25px;
            height: 25px;
            border: 1.5px dashed rgba(0, 210, 255, 0.4);
            border-radius: 50%;
            z-index: 5;
            opacity: 0;
        }

        /* --- 🎭 ESTADO DE FALA DIGITAL (Simulação Ativa) --- */
        .talking .hologram-character {
            animation: respirarNatural 1.5s ease-in-out infinite alternate, flickerLight 0.05s infinite, gesticularCorpo 0.2s infinite alternate !important;
        }
        .talking .digital-lips {
            opacity: 0.8;
            animation: mexerLabios 0.1s infinite alternate;
        }
        .talking .digital-hand-glow {
            opacity: 0.85;
            animation: mexerMaos 0.3s infinite alternate;
        }

        .stage-scanlines {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 70px;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.35) 50%);
            background-size: 100% 4px;
            z-index: 6;
            pointer-events: none;
        }

        .base-podium {
            width: 320px;
            height: auto;
            z-index: 10;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .input-area {
            margin: 25px 0 15px 0;
            display: flex;
            gap: 10px;
        }
        .input-area input {
            flex: 1;
            background: rgba(2, 18, 44, 0.7);
            border: 1px solid #00d2ff;
            padding: 12px;
            color: #00d2ff;
            font-family: inherit;
            font-size: 14px;
            outline: none;
            box-shadow: inset 0 0 8px rgba(0, 210, 255, 0.2);
        }
        .input-area button {
            background: rgba(0, 85, 255, 0.3);
            border: 1px solid #00d2ff;
            color: #00d2ff;
            font-family: inherit;
            padding: 0 20px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            transition: all 0.2s;
        }
        .input-area button:hover {
            background: #00d2ff;
            color: #010610;
            box-shadow: 0 0 15px #00d2ff;
        }

        .status-box {
            color: #00d2ff;
            font-size: 12px;
            margin: 10px 0;
            min-height: 18px;
            text-transform: uppercase;
        }

        .text-display {
            background: rgba(2, 14, 36, 0.85);
            border: 1px solid rgba(0, 210, 255, 0.3);
            position: relative;
            padding: 15px;
            font-size: 13px;
            line-height: 1.6;
            color: #94b5db;
            max-height: 95px;
            overflow-y: auto;
            text-align: left;
        }

        /* --- KEYFRAMES DE ANIMAÇÃO --- */
        @keyframes respirarNatural {
            0% { transform: translateY(0px) scaleY(1) scaleX(1); }
            50% { transform: translateY(-3px) scaleY(1.015) scaleX(0.995); }
            100% { transform: translateY(-8px) scaleY(0.99) scaleX(1.005); }
        }
        @keyframes flickerLight {
            0% { opacity: 0.85; }
            50% { opacity: 0.92; }
            100% { opacity: 0.87; }
        }
        @keyframes gesticularCorpo {
            0% { transform: rotate(-0.8deg) translateY(-4px); }
            100% { transform: rotate(0.8deg) translateY(-8px); }
        }
        @keyframes mexerLabios {
            0% { transform: scaleY(0.1); }
            100% { transform: scaleY(3.0) scaleX(1.1); }
        }
        @keyframes mexerMaos {
            0% { transform: scale(0.85) translate(-2px, 2px); }
            100% { transform: scale(1.15) translate(4px, -2px); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Sir. Cond. COLY</h1>
        <div class="subtitle">Secure Visual Engine v6.2</div>

        <div class="stage" id="stage-box">
            <div class="stage-scanlines"></div>
            
            <div class="hologram-character">
                <img src="homem.png" alt="Sir. COLY">
                <div class="digital-lips"></div>
                <div class="digital-hand-glow"></div>
            </div>
            
            <img class="base-podium" src="base.png" alt="Base">
        </div>

        <div class="input-area">
            <input type="text" id="user-input" placeholder="ESCREVA A SUA DÚVIDA AQUI...">
            <button onclick="enviarComando()">Executar</button>
        </div>

        <div id="status-message" class="status-box">SISTEMA ONLINE // PRONTO PARA DIGITAR</div>
        <div id="text-log" class="text-display">> COLY_SYS: Consola livre de erros. Escreva sobre reservas, quotas ou avarias e clique em Executar.</div>
    </div>

    <script>
        const stageBox = document.getElementById('stage-box');
        const statusMsg = document.getElementById('status-message');
        const textLog = document.getElementById('text-log');
        const userInput = document.getElementById('user-input');

        // Escuta a tecla Enter diretamente no campo de texto
        userInput.addEventListener("keypress", function(e) {
            if (e.key === "Enter") {
                enviarComando();
            }
        });

        function simularFalaVisual(textoIA) {
            // Ativa o estado de fala (Gesticulação, Lábios e Mão Néon a mexer em loops rápidos)
            stageBox.classList.add('talking');
            statusMsg.innerText = "SIR. COLY A RESPONDER...";

            textLog.innerHTML += `<br><br><strong>> SIR. COLY:</strong> ${textoIA}`;
            textLog.scrollTop = textLog.scrollHeight; 

            // Mantém a animação ativa por 4 segundos e depois volta à respiração calma
            setTimeout(() => {
                stageBox.classList.remove('talking');
                statusMsg.innerText = "TERMINAL PRONTO.";
            }, 4500);
        }

        function enviarComando() {
            const pergunta = userInput.value.trim();
            if (!pergunta) return;

            const textoNorm = pergunta.toLowerCase();
            textLog.innerHTML = `<strong>> MORADOR:</strong> ${pergunta}`;
            userInput.value = ""; 
            
            statusMsg.innerText = "A ANALISAR CONDOMÍNIO...";

            let respostaSirColy = "Como o seu assistente pessoal de condomínio, respondo a dúvidas sobre Reservas, Quotas ou Avarias.";

            if (textoNorm.includes("reserva") || textoNorm.includes("piscina") || textoNorm.includes("salão")) {
                respostaSirColy = "Acesso concedido. O agendamento de áreas comuns está aberto no seu painel. Verifique os horários livres e desfrute.";
            } 
            else if (textoNorm.includes("quota") || textoNorm.includes("pagar") || textoNorm.includes("financeiro")) {
                respostaSirColy = "Conta regularizada. As suas quotas encontram-se totalmente saldadas. O próximo pagamento ocorre no dia dez.";
            } 
            else if (textoNorm.includes("avaria") || textoNorm.includes("estragado") || textoNorm.includes("elevador")) {
                respostaSirColy = "Avaria registada. A equipa técnica foi notificada para verificar a situação.";
            }

            simularFalaVisual(respostaSirColy);
        }
    </script>
</body>
</html>
